name: dna_rljson
description: "DNA of all rljson repos: every topic layer in one dependency"
version: 0.3.1
repository: https://github.com/rljson/dna_rljson.git
# Published to npm only (@rljson/dna-rljson): every consumer is a TypeScript repo.
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  dna_blog: ^0.3.0
  dna_clean_code: ^0.3.0
  dna_guides: ^0.2.0
  dna_index: ^0.2.0
  dna_install: ^0.2.0
  dna_readme: ^0.3.1
  dna_translate: ^0.3.0
  dna_gg: ^1.1.1

dev_dependencies:
  helix: ^1.14.0
  lints: ^6.1.0
  test: ^1.33.0
